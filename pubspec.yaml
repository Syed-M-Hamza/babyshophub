name: babyshophub
description: BabyShopHub — a pastel baby-products shopping app built with Flutter and Firebase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1
  cloud_functions: ^7.0.1
  provider: ^6.1.5+1
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  cached_network_image: ^4.0.6
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/napkinpic.png
    - lib/babyimg.jpg
